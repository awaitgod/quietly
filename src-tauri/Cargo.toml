[package]
name = "quietly"
version = "0.1.2"
description = "Quietly Desktop Messenger"
authors = ["Quietly Team"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "quietly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
window-vibrancy = "0.5"
rusqlite = { version = "0.31", features = ["bundled", "vtab", "serde_json"] }
tokio = { version = "1", features = ["full"] }
